<!--
  Painel do gestor da frota Bridi. Só mostra dados para código de gestor; tudo vem da ação "painel"
  da função "abastecimento" do Supabase. Para testar com a API simulada: index.html?api=http://127.0.0.1:8767
-->
<style>
/* Identidade Bridi, a mesma do Estoque de Madeira (estoque-madeira/app/static/app.css): azuis tirados
   dos pixels do logo. --bridi-claro (#0090CF) só decora (faixa do topo): não tem contraste para texto. */
:root {
  --bridi: #005EA4; --bridi-escuro: #183C8A; --bridi-claro: #0090CF;
  --bg: #f4f6f9; --surface: #ffffff; --sunk: #eef2f6; --ink: #17202b; --muted: #556070; --line: #d6dde6;
  --accent: #005EA4; --accent-hover: #004B85; --accent-ink: #ffffff; --accent-soft: #e4eef8;
  --ok: #23703f; --ok-soft: #e2f2e7; --warn: #8a5a00; --warn-soft: #fbefd6; --err: #b0352b; --err-soft: #f8e2de;
  --patio-bm: #1e5c4b; --patio-bm-ink: #ffffff; --patio-bridi: #183C8A; --patio-bridi-ink: #ffffff;
  --row-hover: #f3f7fc; --shadow: rgba(16,32,56,.14); --titulo: #183C8A;
  --f-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Cascadia Mono", Consolas, ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --surface: #18202a; --sunk: #141a22; --ink: #e4e9ef; --muted: #9aa6b5; --line: #2b3542;
    --accent: #6CB4EA; --accent-hover: #8cc6f0; --accent-ink: #0b1a2a; --accent-soft: #1a2c40;
    --ok: #6ec58f; --ok-soft: #1b3124; --warn: #e3ad4b; --warn-soft: #382c14; --err: #f0897e; --err-soft: #3b201d;
    --patio-bm: #73c2a7; --patio-bm-ink: #0f1a16; --patio-bridi: #9cc3f0; --patio-bridi-ink: #0b1a2a;
    --row-hover: #1c2632; --shadow: rgba(0,0,0,.5); --titulo: #e4e9ef;
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .marca img, :root:not([data-theme="light"]) .logo { background: #fff; border-radius: 6px; padding: 3px 4px; }
}
:root[data-theme="dark"] {
  --bg: #11161d; --surface: #18202a; --sunk: #141a22; --ink: #e4e9ef; --muted: #9aa6b5; --line: #2b3542;
  --accent: #6CB4EA; --accent-hover: #8cc6f0; --accent-ink: #0b1a2a; --accent-soft: #1a2c40;
  --ok: #6ec58f; --ok-soft: #1b3124; --warn: #e3ad4b; --warn-soft: #382c14; --err: #f0897e; --err-soft: #3b201d;
  --patio-bm: #73c2a7; --patio-bm-ink: #0f1a16; --patio-bridi: #9cc3f0; --patio-bridi-ink: #0b1a2a;
  --row-hover: #1c2632; --shadow: rgba(0,0,0,.5); --titulo: #e4e9ef;
  color-scheme: dark;
}
:root[data-theme="dark"] .marca img, :root[data-theme="dark"] .logo { background: #fff; border-radius: 6px; padding: 3px 4px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
p { margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
a:hover { color: var(--accent-hover); }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
button:focus-visible, a:focus-visible, summary:focus-visible, label.foto:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

/* barra do topo: faixa azul em degradê, B da Bridi e nome do sistema */
.appbar { background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 var(--shadow); }
.appbar::before { content: ""; display: block; height: 4px; background: linear-gradient(90deg, var(--bridi-claro), var(--bridi) 55%, var(--bridi-escuro)); }
.appbar .in { margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; }
.marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
.marca img { display: block; height: 38px; width: auto; flex: none; }
.marca .nome { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.marca .nome b { font-family: var(--f-display); font-size: 17px; font-weight: 700; color: var(--titulo); letter-spacing: -.005em; }
.marca .nome span { font-size: 12px; color: var(--muted); }
button.link { border: 0; background: none; color: var(--accent); padding: 6px 4px; font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer; }
button.link:hover { color: var(--accent-hover); text-decoration: underline; }

/* cartão de entrada: logo completo e borda azul em cima */
.login.panel, .login.cartao { border-top: 4px solid var(--bridi); }
.login .logo { display: block; height: 72px; width: auto; }
.rotulo { font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* --- painel do gestor --- */
.appbar .in, .wrap { max-width: 1280px; }
.wrap { margin: 0 auto; padding: 18px 20px 48px; display: grid; gap: 18px; }
@media (max-width: 480px) { .wrap, .appbar .in { padding-inline: 16px; } }
nav.menu { display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center; font-size: 13.5px; margin-left: auto; justify-content: flex-end; }
nav.menu .aba { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
nav.menu .aba:hover { background: var(--sunk); color: var(--ink); }
nav.menu .aba[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
nav.menu .who { margin-left: 10px; padding-left: 12px; border-left: 1px solid var(--line); font-size: 13px; color: var(--muted); }
@media (max-width: 700px) { .marca .nome span { display: none; } nav.menu .who { display: none; } }
.tela { display: grid; gap: 18px; min-width: 0; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.subtitulo { color: var(--muted); font-size: 13.5px; margin-top: 4px; max-width: 70ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; display: grid; gap: 10px; align-content: start; }
.panel h2 { font-family: var(--f-display); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.panel > p { font-size: 12.5px; color: var(--muted); max-width: 110ch; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; gap: 2px; }
.kpi .r { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1.2; color: var(--titulo); }
.kpi .d { font-size: 12.5px; color: var(--muted); }
.filtro { display: flex; gap: 8px; align-items: center; }
.filtro label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
select { font: inherit; color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; }
.rolo { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; text-align: left; padding: 8px 10px; background: var(--sunk); border-bottom: 2px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
tbody tr:hover td { background: var(--row-hover); }
tr:last-child td { border-bottom: 0; }
.n { text-align: right; }
td.texto { white-space: normal; min-width: 220px; }
.placa { display: inline-block; font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; padding: 2px 6px; border-radius: 5px; background: var(--sunk); border: 1px solid var(--line); }
.sub { display: block; color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.tag { display: inline-flex; align-items: center; font-weight: 600; font-size: 12.5px; white-space: nowrap; border-radius: 999px; padding: 1px 9px; }
.tag.ok { color: var(--ok); background: var(--ok-soft); }
.tag.warn { color: var(--warn); background: var(--warn-soft); }
.tag.crit { color: var(--err); background: var(--err-soft); }
.tag.neutro { color: var(--muted); background: var(--sunk); }
.patio { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
.patio.bm { background: var(--patio-bm); color: var(--patio-bm-ink); }
.patio.bridi { background: var(--patio-bridi); color: var(--patio-bridi-ink); }
.ruim { color: var(--err); font-weight: 650; }
.atencao { color: var(--warn); font-weight: 650; }
.vazio { color: var(--muted); font-size: 14px; padding: 14px; text-align: center; background: var(--sunk); border-radius: 8px; }
.fotos { display: flex; gap: 6px; }
.btn-foto { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); padding: 2px 9px; font-size: 12.5px; font-weight: 600; }
.btn-foto:hover { border-color: var(--accent); }
.calor td.c { text-align: right; min-width: 56px; }
.calor td.zero { color: var(--muted); }
.notas { font-size: 13px; color: var(--muted); max-width: 90ch; }
.notas summary { cursor: pointer; color: var(--ink); font-weight: 600; }
.notas ul { padding-left: 18px; display: grid; gap: 4px; }
.aviso { font-size: 13.5px; padding: 9px 12px; border-radius: 8px; }
.aviso.erro { background: var(--err-soft); color: var(--err); font-weight: 600; }
.aviso.info { background: var(--sunk); }
.login { max-width: 360px; width: 100%; margin: 10vh auto 0; gap: 12px; }
.campo { display: grid; gap: 5px; }
.campo label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.ajuda { font-size: 12.5px; color: var(--muted); }
.login input[type=password] { font: inherit; width: 100%; height: 48px; font-size: 22px; letter-spacing: .4em; text-align: center; color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; }
.lembrar { display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.lembrar input { width: 18px; height: 18px; accent-color: var(--accent); }
button.primary { width: 100%; font: inherit; cursor: pointer; background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 8px; font-weight: 600; padding: 11px 18px; font-size: 15px; }
button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
button.primary:disabled { opacity: .45; cursor: not-allowed; }
.rodape { font-size: 12.5px; color: var(--muted); }
.carregando { opacity: .55; pointer-events: none; }
</style>
</head>
<body>
<header class="appbar">

      <label for="codigo">Código de gestor</label>
      <input id="codigo" class="num" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
      <span class="ajuda">O mesmo código de 6 números do formulário de abastecimento. Só código de gestor abre o painel.</span>
    </div>
    <label class="lembrar"><input type="checkbox" id="lembrar"> Lembrar neste aparelho</label>
    <div class="aviso erro" id="erro-entrar" hidden></div>
    <button class="primary" id="btn-entrar">Entrar</button>
  </section>

  <div class="aviso erro" id="erro-geral" hidden></div>
  <section class="tela" id="tela-agora" hidden></section>
  <section class="tela" id="tela-abastecimento" hidden></section>
  <section class="tela" id="tela-rotas" hidden></section>
  <p class="rodape" id="rodape" hidden></p>
</main>

<script>
(() => {
  const API_PADRAO = "https://zjodewyhotujohbtccal.supabase.co/functions/v1/abastecimento";
  const API = new URLSearchParams(location.search).get("api") || API_PADRAO;
  const CHAVE = "bridi-painel-codigo";
  const TZ = "America/Sao_Paulo";
  const LIMITE_VEL = 90;
  const TOLERANCIA_L = 1;
  const $ = (id) => document.getElementById(id);
  const est = { codigo: "", dados: null, aba: "agora", mes: null, semana: null };
  // Pontos de referência cadastrados no Fulltrack (os mesmos de analise/resumo_frota.py), raio de 300 m.
  const PONTOS = [
    ["Pátio Bridi Vila Velha", "base", -20.35072, -40.322],
    ["Bridi Vila Velha (2º endereço)", "base", -20.36914, -40.32511],
    ["Base BM Guarapari", "base", -20.63073, -40.47832],
    ["Cliente (base) Cariacica", "cliente", -20.34084, -40.40546],
    ["Oficina Andreatta", "oficina", -20.34648, -40.4036],
    ["Oficina mecânica Guarapari", "oficina", -20.66312, -40.50361],
    ["Oficina mecânica (sul do ES)", "oficina", -20.79322, -40.80608],
  ];
  const RAIO_M = 300;
  const SEM_GPS_H = 2;          // comunica mas a posição não atualiza há mais que isso
  const SEM_COMUNICAR_H = 24;   // rastreador mudo (dorme com a ignição desligada, então 24 h)
  const COLETA_ATRASADA_MIN = 15;

  // ---------- armazenamento (pode faltar em janela privada) ----------
  const guardar = {
    ler() { for (const s of [sessionStorage, localStorage]) { try { const v = s.getItem(CHAVE); if (v) return v; } catch { /* sem armazenamento */ } } return ""; },
    gravar(v, lembrar) {
      for (const s of [sessionStorage, localStorage]) { try { s.removeItem(CHAVE); } catch { /* nada */ } }
      if (!v) return;
      try { (lembrar ? localStorage : sessionStorage).setItem(CHAVE, v); } catch { /* nada */ }
    },
  };

  // ---------- formatos ----------
  const formatos = {};
  const nf = (c) => formatos[c] ??= new Intl.NumberFormat("pt-BR", { minimumFractionDigits: c, maximumFractionDigits: c });
  const num = (v, c = 0) => (v == null || v === "" || !Number.isFinite(+v)) ? "—" : nf(c).format(+v);
  const reais = (v) => (v == null || !Number.isFinite(+v)) ? "—" : "R$ " + num(v, 2);
  const dataCurta = (iso) => new Date(iso).toLocaleDateString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit" });
  const dataHora = (iso) => new Date(iso).toLocaleString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const mesDe = (iso) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit" }).format(new Date(iso));
  const nomeMes = (m) => { const [a, mm] = m.split("-").map(Number); const t = new Date(Date.UTC(a, mm - 1, 15)).toLocaleDateString("pt-BR", { month: "long", year: "numeric", timeZone: "UTC" }); return t.charAt(0).toUpperCase() + t.slice(1); };
  const soma = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
  const plural = (n, um, varios) => n + " " + (n === 1 ? um : varios);
  // dia "aaaa-mm-dd" -> segunda-feira da semana, "aaaa-mm-dd"
  const segunda = (dia) => { const [a, m, d] = dia.split("-").map(Number); const t = new Date(Date.UTC(a, m - 1, d)); t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7)); return t.toISOString().slice(0, 10); };
  const maisDias = (dia, n) => { const [a, m, d] = dia.split("-").map(Number); return new Date(Date.UTC(a, m - 1, d + n)).toISOString().slice(0, 10); };
  const ddmm = (dia) => dia.slice(8, 10) + "/" + dia.slice(5, 7);
  const nomeDia = (dia) => { const [a, m, d] = dia.split("-").map(Number); return ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"][new Date(Date.UTC(a, m - 1, d)).getUTCDay()] + " " + ddmm(dia); };

  // ---------- montar elementos sem innerHTML (os textos vêm do formulário) ----------
  function el(tag, props = {}, ...filhos) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "style") e.style.cssText = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const f of filhos.flat()) if (f != null && f !== false) e.append(f instanceof Node ? f : String(f));
    return e;
  }
  const placa = (p, sub) => el("span", {}, el("span", { class: "placa", text: p }), sub ? el("span", { class: "sub", text: sub }) : null);
  const tag = (texto, tipo = "neutro") => el("span", { class: "tag " + tipo, text: texto });
  const kpi = (rotulo, valor, detalhe) => el("div", { class: "panel kpi" }, el("span", { class: "r", text: rotulo }), el("span", { class: "v", text: valor }), detalhe ? el("span", { class: "d", text: detalhe }) : null);
  const secao = (titulo, explica, corpo) => el("section", { class: "panel" }, el("h2", { text: titulo }), explica ? el("p", { text: explica }) : null, corpo);
  const cabecalho = (titulo, explica, filtro) => el("header", { class: "top" }, el("div", {}, el("h1", { text: titulo }), el("p", { class: "subtitulo", text: explica })), filtro);
  // selo do pátio com a cor de cada empresa, como no Estoque de Madeira
  const seloPatio = (local) => local === "guarapari" ? el("span", {}, el("span", { class: "patio bm", text: "BM" }), "Guarapari")
    : local === "vila_velha" ? el("span", {}, el("span", { class: "patio bridi", text: "Bridi" }), "Vila Velha") : "Pátio";

  // tabela: colunas [{t: título, n: numérica}], linhas: arrays de células (texto, nó ou {v, class})
  function tabela(colunas, linhas, vazio, extraClasse) {
    if (!linhas.length) return el("p", { class: "vazio", text: vazio });
    const thead = el("thead", {}, el("tr", {}, colunas.map((c) => el("th", { class: c.n ? "n" : null, text: c.t }))));
    const tbody = el("tbody", {}, linhas.map((l) => el("tr", {}, l.map((cel, i) => {
      const o = (cel && typeof cel === "object" && !(cel instanceof Node)) ? cel : { v: cel };
      const cls = [colunas[i].n ? "n" : "", colunas[i].texto ? "texto" : "", o.class || ""].join(" ").trim() || null;
      return el("td", { class: cls, style: o.style }, o.v ?? "—");
    }))));
    return el("div", { class: "rolo" }, el("table", { class: extraClasse || null }, thead, tbody));
  }

  // ---------- API ----------
  async function chamar(acao, extra = {}) {
    let r;
    try {
      r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ acao, codigo: est.codigo, ...extra }) });
    } catch {
      throw Object.assign(new Error("Sem conexão. Confira a internet e tente de novo."), { status: 0 });
    }
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw Object.assign(new Error(j.erro || "Erro no servidor."), { status: r.status });
    return j.dados;
  }

  async function abrirFoto(caminho) {
    const janela = window.open("", "_blank");  // abre já no clique, senão o navegador bloqueia
    try {
      const { url } = await chamar("foto", { caminho });
      if (janela) janela.location.href = url; else location.href = url;
    } catch (e) {
      if (janela) janela.close();
      alert(e.message);
    }
  }
  const fotos = (pares) => {
    const bts = pares.filter(([, c]) => c).map(([nome, c]) => el("button", { class: "btn-foto", type: "button", onclick: () => abrirFoto(c), text: nome }));
    return bts.length ? el("span", { class: "fotos" }, bts) : "—";
  };

  // ---------- entrar ----------
  async function carregar() {
    $("erro-geral").hidden = true;
    document.querySelector("main").classList.add("carregando");
    try {
      est.dados = await chamar("painel");
      $("tela-entrar").hidden = true;
      $("menu").hidden = false; $("rodape").hidden = false;
      $("quem").textContent = est.dados.nome;
      $("rodape").textContent = "Atualizado em " + dataHora(est.dados.gerado_em) + ". Dados do formulário de abastecimento, da API do Fulltrack (a cada 5 min) e dos relatórios carregados no banco.";
      desenhar();
      return true;
    } catch (e) {
      if (e.status === 401 || e.status === 403) { sair(); mostrarErroEntrar(e.status === 403 ? "Este código não é de gestor. Peça um código de gestor." : e.message); }
      else if (est.dados) { $("erro-geral").textContent = e.message; $("erro-geral").hidden = false; }
      else mostrarErroEntrar(e.message);
      return false;
    } finally {
      document.querySelector("main").classList.remove("carregando");
    }
  }
  function mostrarErroEntrar(msg) { $("erro-entrar").textContent = msg; $("erro-entrar").hidden = false; }
  function sair() {
    est.codigo = ""; est.dados = null; guardar.gravar("");
    $("tela-entrar").hidden = false;
    for (const id of ["menu", "rodape", "tela-agora", "tela-abastecimento", "tela-rotas", "erro-geral"]) $(id).hidden = true;
    $("quem").textContent = "";
  }
  $("btn-entrar").addEventListener("click", async () => {
    const c = $("codigo").value.replace(/\D/g, "");
    $("erro-entrar").hidden = true;
    if (c.length !== 6) return mostrarErroEntrar("O código tem 6 números.");
    est.codigo = c;
    $("btn-entrar").disabled = true;
    if (await carregar()) { guardar.gravar(c, $("lembrar").checked); $("codigo").value = ""; }
    $("btn-entrar").disabled = false;
  });
  $("codigo").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-entrar").click(); });
  $("sair").addEventListener("click", sair);
  $("atualizar").addEventListener("click", carregar);
  for (const b of document.querySelectorAll("#abas button")) {
    b.addEventListener("click", () => { est.aba = b.dataset.aba; desenhar(); });
  }

  function desenhar() {
    for (const b of document.querySelectorAll("#abas button")) b.setAttribute("aria-pressed", String(b.dataset.aba === est.aba));
    $("tela-agora").hidden = est.aba !== "agora";
    $("tela-abastecimento").hidden = est.aba !== "abastecimento";
    $("tela-rotas").hidden = est.aba !== "rotas";
    if (est.aba === "agora") desenharAgora();
    else if (est.aba === "abastecimento") desenharAbastecimento(); else desenharRotas();
  }

  // ---------- aba Agora ----------
  function distanciaM(la1, lo1, la2, lo2) {
    const r = Math.PI / 180, a = Math.sin((la2 - la1) * r / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin((lo2 - lo1) * r / 2) ** 2;
    return 2 * 6371000 * Math.asin(Math.sqrt(a));
  }
  function pontoPerto(lat, lon) {
    if (!Number.isFinite(lat) || !Number.isFinite(lon) || (!lat && !lon)) return null;
    let melhor = null;
    for (const [nome, tipo, la, lo] of PONTOS) {
      const d = distanciaM(lat, lon, la, lo);
      if (d <= RAIO_M && (!melhor || d < melhor.d)) melhor = { nome, tipo, d };
    }
    return melhor;
  }
  const haQuanto = (iso, agoraMs) => {
    if (!iso) return "—";
    const min = Math.max(0, Math.round((agoraMs - Date.parse(iso)) / 60000));
    if (min < 1) return "agora";
    if (min < 60) return "há " + min + " min";
    const h = Math.floor(min / 60);
    if (h < 48) return "há " + h + " h" + (min % 60 && h < 10 ? " " + (min % 60) + " min" : "");
    return "há " + Math.floor(h / 24) + " dias";
  };

  function desenharAgora() {
    const d = est.dados;
    const raiz = $("tela-agora");
    const a = d.agora || { status: [], km_hoje: {} };
    const agoraMs = Date.parse(d.gerado_em) || Date.now();
    const modelo = Object.fromEntries(d.veiculos.map((v) => [v.placa, v.modelo]));
    const semRastreador = d.veiculos.filter((v) => v.categoria === "veiculo" && !v.rastreado).length;

    if (!a.status.length) {
      raiz.replaceChildren(cabecalho("Agora", "Situação de cada caminhão rastreado."),
        el("div", { class: "aviso info", text: "Ainda não há leitura do GPS no banco. A coleta da API do Fulltrack (função coletar_gps) grava a cada 5 minutos." }));
      return;
    }

    const linhas = [], alertas = [];
    let andando = 0, ligadoParado = 0, desligado = 0;
    for (const s of a.status) {
      const lat = Number(s.latitude), lon = Number(s.longitude);
      const ponto = pontoPerto(lat, lon);
      const vel = Number(s.velocidade_kmh) || 0;
      const situacao = s.ignicao || "—";
      const semGpsH = s.data_gps && s.ult_comunicacao ? (Date.parse(s.ult_comunicacao) - Date.parse(s.data_gps)) / 3_600_000 : 0;
      const mudoH = s.ult_comunicacao ? (agoraMs - Date.parse(s.ult_comunicacao)) / 3_600_000 : Infinity;
      let selo;
      if (situacao === "Ligado em movimento") { andando++; selo = tag("Andando · " + num(vel) + " km/h", vel > LIMITE_VEL ? "crit" : "ok"); }
      else if (situacao === "Ligado parado") { ligadoParado++; selo = tag("Ligado parado", ponto && ponto.tipo !== "cliente" ? "neutro" : "warn"); }
      else { desligado++; selo = tag("Desligado", "neutro"); }

      const mapa = Number.isFinite(lat) && Number.isFinite(lon) && (lat || lon)
        ? el("a", { href: "https://www.google.com/maps?q=" + lat + "," + lon, target: "_blank", rel: "noopener", text: "mapa" }) : null;
      const onde = el("span", {}, ponto ? ponto.nome : "Fora dos pontos cadastrados", mapa ? el("span", { class: "sub" }, mapa) : null);
      linhas.push([
        placa(s.placa, modelo[s.placa]),
        selo,
        onde,
        el("span", {}, haQuanto(s.data_gps, agoraMs), el("span", { class: "sub", text: s.data_gps ? dataHora(s.data_gps) : "" })),
        { v: haQuanto(s.ult_comunicacao, agoraMs), class: mudoH > SEM_COMUNICAR_H ? "ruim" : null },
        { v: num(a.km_hoje?.[s.placa], 1) },
        { v: num(s.odometro_gps_km) },
      ]);

      if (mudoH > SEM_COMUNICAR_H) alertas.push([placa(s.placa), tag("Sem comunicar", "crit"), { v: "O rastreador não fala desde " + dataHora(s.ult_comunicacao) + ". Pode ser bateria, chave geral desligada ou defeito.", class: "texto" }, mapa || "—"]);
      else if (semGpsH > SEM_GPS_H) alertas.push([placa(s.placa), tag("Sem posição", "warn"), { v: "O rastreador comunica, mas a posição não muda desde " + dataHora(s.data_gps) + ". Caminhão em local coberto ou antena de GPS com problema.", class: "texto" }, mapa || "—"]);
      if (situacao === "Ligado parado" && !(ponto && ponto.tipo !== "cliente")) alertas.push([placa(s.placa), tag("Ligado parado", "warn"), { v: "Motor ligado, parado " + (ponto ? "em " + ponto.nome : "fora do pátio") + " (" + haQuanto(s.data_gps, agoraMs) + ").", class: "texto" }, mapa || "—"]);
      if (vel > LIMITE_VEL) alertas.push([placa(s.placa), tag("Velocidade", "crit"), { v: num(vel) + " km/h na última leitura (limite " + LIMITE_VEL + ").", class: "texto" }, mapa || "—"]);
    }

    const coletaOk = a.ultima_coleta_ok;
    const atrasada = !coletaOk || (agoraMs - Date.parse(coletaOk)) / 60000 > COLETA_ATRASADA_MIN;
    const avisoColeta = atrasada
      ? el("div", { class: "aviso erro", text: "A coleta do GPS está parada: a última leitura boa foi " + (coletaOk ? dataHora(coletaOk) : "nunca") + (a.ultima_coleta?.erro ? ". Último erro: " + a.ultima_coleta.erro : "") + "." })
      : null;

    raiz.replaceChildren(...[
      cabecalho("Agora", "Situação de cada caminhão rastreado. O banco lê a API do Fulltrack a cada 5 minutos; aperte Atualizar para ver a leitura mais nova."),
      avisoColeta,
      el("div", { class: "kpis" },
        kpi("Andando", String(andando), plural(a.status.length, "rastreado", "rastreados")),
        kpi("Ligado parado", String(ligadoParado)),
        kpi("Desligados", String(desligado)),
        kpi("Para conferir", String(alertas.length), alertas.length ? "veja abaixo" : "nada fora do normal"),
      ),
      secao("Caminhões", "Km hoje = odômetro do GPS agora menos o primeiro de hoje. É uma medida do GPS, para conferência, não o km do painel do caminhão.",
        tabela([{ t: "Veículo" }, { t: "Situação" }, { t: "Onde" }, { t: "Última posição" }, { t: "Comunicou" }, { t: "Km hoje", n: true }, { t: "Odômetro GPS", n: true }], linhas, "Sem leitura.")),
      secao("Para conferir", "Rastreador mudo há mais de " + SEM_COMUNICAR_H + " h, comunicando sem posição há mais de " + SEM_GPS_H + " h, motor ligado parado fora do pátio e oficina, ou acima de " + LIMITE_VEL + " km/h.",
        tabela([{ t: "Veículo" }, { t: "O quê" }, { t: "Detalhe", texto: true }, { t: "Onde" }], alertas, "Nada fora do normal agora.")),
      semRastreador ? el("p", { class: "notas", text: plural(semRastreador, "veículo sem rastreador não aparece", "veículos sem rastreador não aparecem") + " aqui." }) : null,
      a.ultima_coleta_ok ? el("p", { class: "notas", text: "Última leitura do GPS: " + dataHora(a.ultima_coleta_ok) + "." }) : null,
    ].filter(Boolean));  // replaceChildren escreveria "null" como texto
  }

  // ---------- aba Abastecimento ----------
  function desenharAbastecimento() {
    const d = est.dados;
    const raiz = $("tela-abastecimento");
    const meses = [...new Set([mesDe(new Date().toISOString()), ...d.lancamentos.map((l) => mesDe(l.data_hora))])].sort().reverse();
    if (!meses.includes(est.mes)) est.mes = meses[0];
    const m = est.mes;
    const L = d.lancamentos.filter((l) => mesDe(l.data_hora) === m);
    const patio = L.filter((l) => l.origem === "patio"), estrada = L.filter((l) => l.origem === "estrada");
    const litrosEstrada = soma(estrada, (l) => l.litros), gasto = soma(estrada, (l) => l.valor_total);
    const doMes = d.meses.filter((x) => String(x.mes).slice(0, 7) === m);
    const kmlFrota = soma(doMes, (x) => x.litros) ? soma(doMes, (x) => x.km) / soma(doMes, (x) => x.litros) : null;
    const alertasMes = d.alertas_consumo.filter((a) => mesDe(a.fim) === m);
    const veic = new Map(d.veiculos.map((v) => [v.placa, v]));
    const ref = new Map(d.referencia.map((r) => [r.placa, r]));
    const localVisita = new Map(d.visitas.map((v) => [v.id, v.local]));

    const filtro = el("div", { class: "filtro" },
      el("label", { for: "mes", text: "Mês" }),
      el("select", { id: "mes", onchange: (e) => { est.mes = e.target.value; desenharAbastecimento(); } },
        meses.map((x) => el("option", { value: x, selected: x === m, text: nomeMes(x) }))));

    const kpis = el("div", { class: "kpis" },
      kpi("Litros no pátio", num(soma(patio, (l) => l.litros), 0), plural(patio.length, "lançamento", "lançamentos") + " do caminhão-tanque"),
      kpi("Litros na estrada", num(litrosEstrada, 0), plural(estrada.length, "abastecimento", "abastecimentos") + " em posto"),
      kpi("Gasto na estrada", reais(gasto), litrosEstrada ? "média " + reais(gasto / litrosEstrada) + " por litro" : "sem lançamento"),
      kpi("Média da frota", kmlFrota ? num(kmlFrota, 2) + " km/l" : "—", doMes.length ? plural(soma(doMes, (x) => x.trechos), "trecho", "trechos") + " tanque cheio a tanque cheio" : "precisa de 2 tanques cheios por veículo"),
      kpi("Consumo abaixo do esperado", String(alertasMes.length), alertasMes.length ? num(soma(alertasMes, (a) => a.litros_a_mais), 0) + " litros a mais que a referência" : "nenhum trecho no mês"));

    // consumo por veículo
    const ultimoKm = new Map();
    for (const l of d.lancamentos) if (l.hodometro != null && !(ultimoKm.get(l.placa) > +l.hodometro)) ultimoKm.set(l.placa, +l.hodometro);
    const linhasConsumo = d.veiculos.filter((v) => v.categoria === "veiculo").map((v) => {
      const cm = doMes.find((x) => x.placa === v.placa);
      const r = ref.get(v.placa);
      const kml = cm ? +cm.km_l : null, rv = r && r.referencia != null ? +r.referencia : null;
      const dif = kml != null && rv ? (kml / rv - 1) * 100 : null;
      return { v, cm, r, kml, rv, dif, litros: soma(L.filter((l) => l.placa === v.placa), (l) => l.litros) };
    }).sort((a, b) => (a.dif == null) - (b.dif == null) || (a.dif ?? 0) - (b.dif ?? 0) || (b.litros - a.litros) || a.v.placa.localeCompare(b.v.placa));
    const fonte = (r) => !r || r.referencia == null ? "sem referência ainda" : r.fonte === "propria" ? "média própria, " + r.trechos_90d + " trechos" : "pesquisa (provisória)";
    const consumo = tabela(
      [{ t: "Veículo" }, { t: "km/l no mês", n: 1 }, { t: "Referência", n: 1 }, { t: "Diferença", n: 1 }, { t: "Km no mês", n: 1 }, { t: "Litros no mês", n: 1 }, { t: "Último km", n: 1 }],
      linhasConsumo.map(({ v, cm, r, kml, rv, dif, litros }) => [
        placa(v.placa, [v.modelo, v.rastreado ? null : "sem rastreador"].filter(Boolean).join(" · ")),
        kml != null ? num(kml, 2) : { v: "—", class: "muted" },
        { v: el("span", {}, rv != null ? num(rv, 2) : "—", el("span", { class: "sub", text: fonte(r) })) },
        dif == null ? "—" : { v: (dif > 0 ? "+" : "") + num(dif, 0) + "%", class: dif <= -15 ? "ruim" : dif <= -5 ? "atencao" : "" },
        cm ? num(cm.km, 0) : "—",
        litros ? num(litros, 0) : "—",
        ultimoKm.has(v.placa) ? num(ultimoKm.get(v.placa), 0) : "—",
      ]),
      "Nenhum veículo cadastrado.");

    const maquinas = d.veiculos.filter((v) => v.categoria === "maquina").map((v) => [v, soma(L.filter((l) => l.placa === v.placa), (l) => l.litros)]).filter(([, l]) => l > 0);

    const alertas = tabela(
      [{ t: "Veículo" }, { t: "Trecho" }, { t: "Km", n: 1 }, { t: "Litros", n: 1 }, { t: "km/l", n: 1 }, { t: "Referência", n: 1 }, { t: "Queda", n: 1 }, { t: "Litros a mais", n: 1 }],
      d.alertas_consumo.map((a) => [
        placa(a.placa), dataCurta(a.inicio) + " a " + dataCurta(a.fim), num(a.km, 0), num(a.litros, 1),
        { v: num(a.km_l, 2), class: "ruim" }, el("span", {}, num(a.referencia, 2), el("span", { class: "sub", text: a.fonte === "propria" ? "média própria" : "pesquisa" })),
        num(a.queda_pct, 0) + "%", num(a.litros_a_mais, 0),
      ]),
      "Nenhum trecho abaixo do esperado nos últimos 90 dias.");

    const conferir = d.trechos.filter((t) => t.conferir);
    const kmConferir = tabela(
      [{ t: "Veículo" }, { t: "Trecho" }, { t: "Km no início", n: 1 }, { t: "Km no fim", n: 1 }, { t: "Diferença", n: 1 }],
      conferir.map((t) => [placa(t.placa), dataCurta(t.inicio) + " a " + dataCurta(t.fim), num(t.km_inicio, 0), num(t.km_fim, 0), { v: num(t.km, 0), class: +t.km <= 0 ? "ruim" : "" }]),
      "");

    // visitas do caminhão-tanque
    const visitas = tabela(
      [{ t: "Pátio" }, { t: "Chegada" }, { t: "Saída" }, { t: "Encerrante (L)", n: 1 }, { t: "Comprovante S10", n: 1 }, { t: "Lançado S10", n: 1 }, { t: "Comprovante S500", n: 1 }, { t: "Lançado S500", n: 1 }, { t: "Conferência", texto: 1 }, { t: "Fotos" }],
      d.visitas.map((v) => {
        const aberta = !v.saida;
        const enc = aberta ? null : +v.encerrante_fim - +v.encerrante_inicio;
        const comp = (+v.papel_s10_litros || 0) + (+v.papel_s500_litros || 0);
        const difs = [];
        if (!aberta) {
          if (Math.abs(enc - comp) > TOLERANCIA_L) difs.push("encerrante " + num(enc, 0) + " L x comprovante " + num(comp, 0) + " L");
          for (const [t, c, l] of [["S10", v.papel_s10_litros, v.lancado_s10], ["S500", v.papel_s500_litros, v.lancado_s500]]) {
            const dd = +l - +c;
            if (Math.abs(dd) > TOLERANCIA_L) difs.push(t + ": lançado " + (dd > 0 ? num(dd, 0) + " L a mais" : num(-dd, 0) + " L a menos") + " que o comprovante");
          }
        }
        return [
          seloPatio(v.local), dataHora(v.chegada), aberta ? tag("aberta", "warn") : dataHora(v.saida),
          aberta ? "—" : num(enc, 1), aberta ? "—" : num(v.papel_s10_litros, 1), num(v.lancado_s10, 1),
          aberta ? "—" : num(v.papel_s500_litros, 1), num(v.lancado_s500, 1),
          aberta ? el("span", { class: "muted", text: "em andamento" }) : difs.length ? el("span", { class: "atencao", text: difs.join("; ") }) : tag("confere", "ok"),
          fotos([["chegada", v.foto_chegada], ["saída", v.foto_saida], ["comprovante", v.foto_comprovante]]),
        ];
      }),
      "Nenhuma visita do caminhão-tanque registrada ainda.");

    // lançamentos do mês
    const onde = (l) => l.origem === "patio"
      ? seloPatio(localVisita.get(l.visita_id))
      : el("span", {}, "Estrada", l.posto ? el("span", { class: "sub", text: l.posto }) : null);
    const lancs = tabela(
      [{ t: "Quando" }, { t: "Veículo" }, { t: "Onde" }, { t: "Diesel" }, { t: "Litros", n: 1 }, { t: "Km", n: 1 }, { t: "Valor", n: 1 }, { t: "R$/L", n: 1 }, { t: "Quem" }, { t: "Fotos" }],
      L.slice(0, 300).map((l) => [
        dataHora(l.data_hora), placa(l.placa), onde(l), l.diesel || "—", num(l.litros, 1),
        l.hodometro == null ? "—" : el("span", {}, num(l.hodometro, 0), l.km_conferir ? el("span", { class: "sub" }, tag("conferir km", "warn")) : null),
        l.origem === "estrada" ? reais(l.valor_total) : "—",
        l.preco_litro != null ? num(l.preco_litro, 2) : "—",
        el("span", {}, l.registrado_por || "—", l.origem === "estrada" && !l.tanque_cheio ? el("span", { class: "sub", text: "tanque não completado" }) : null),
        fotos([["painel", l.foto_painel], ["nota", l.foto_documento]]),
      ]),
      "Nenhum abastecimento lançado em " + nomeMes(m).toLowerCase() + ".");

    raiz.replaceChildren(
      cabecalho("Abastecimento", "Consumo km/l, caminhão-tanque e lançamentos do pátio e da estrada, por mês.", filtro), kpis,
      secao("Consumo por veículo", "km/l pelo método tanque cheio a tanque cheio. A referência é a média própria dos últimos 90 dias quando há 3 trechos ou mais; antes disso, a pesquisa por modelo. Diferença em vermelho: 15% ou mais abaixo da referência.", consumo),
      maquinas.length ? secao("Máquinas", "Sem hodômetro: só os litros do mês.", tabela([{ t: "Máquina" }, { t: "Litros no mês", n: 1 }], maquinas.map(([v, l]) => [placa(v.placa, v.modelo), num(l, 0)]), "")) : null,
      secao("Consumo abaixo do esperado", "Trechos dos últimos 90 dias com km/l mais de 15% abaixo da referência. É uma pergunta para conferir (carga, trajeto, km digitado), não uma acusação.", alertas),
      conferir.length ? secao("Km para conferir", "Trechos fora da média: o km foi enviado mesmo menor que o anterior ou com salto acima de 3.000 km.", kmConferir) : null,
      secao("Caminhão-tanque", "Encerrante da bomba x comprovante do distribuidor x soma dos lançamentos de cada diesel. Diferença acima de 1 litro aparece em destaque.", visitas),
      secao("Lançamentos de " + nomeMes(m).toLowerCase(), L.length > 300 ? "Mostrando os 300 mais recentes de " + L.length + "." : null, lancs),
    );
  }

  // ---------- aba Rotas ----------
  function desenharRotas() {
    const { dias, alertas } = est.dados.rotas;
    const raiz = $("tela-rotas");
    if (!dias.length) {
      raiz.replaceChildren(el("div", { class: "aviso info", text: "Nenhuma semana do GPS carregada no banco nos últimos 84 dias. Exporte o Histórico de posições do Fulltrack, rode o resumo e a carga (analise/resumo_frota.py e analise/carregar_banco.py)." }));
      return;
    }
    const semanas = [...new Set(dias.map((r) => segunda(r.dia)))].sort().reverse();
    if (!semanas.includes(est.semana)) est.semana = semanas[0];
    const s = est.semana, fim = maisDias(s, 6);
    const D = dias.filter((r) => r.dia >= s && r.dia <= fim);
    const A = alertas.filter((a) => { const dia = new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date(a.quando)); return dia >= s && dia <= fim; });
    const rotulo = (x) => ddmm(x) + " a " + ddmm(maisDias(x, 6)) + "/" + maisDias(x, 6).slice(0, 4);

    const filtro = el("div", { class: "filtro" },
      el("label", { for: "semana", text: "Semana" }),
      el("select", { id: "semana", onchange: (e) => { est.semana = e.target.value; desenharRotas(); } },
        semanas.map((x) => el("option", { value: x, selected: x === s, text: rotulo(x) }))));

    const porPlaca = [...new Set(D.map((r) => r.placa))].map((p) => {
      const R = D.filter((r) => r.placa === p);
      const mov = soma(R, (r) => r.min_em_movimento) / 60, lig = soma(R, (r) => r.min_ligado_parado) / 60;
      return {
        placa: p, km: soma(R, (r) => r.km), vel: Math.max(...R.map((r) => +r.vel_max || 0)),
        acima: soma(R, (r) => r.min_acima_limite), mov, lig, pct: mov + lig ? 100 * lig / (mov + lig) : null,
        fora: R.filter((r) => r.termina_fora_patio).length,
      };
    }).sort((a, b) => b.km - a.km);

    const kpis = el("div", { class: "kpis" },
      kpi("Km rodados", num(soma(porPlaca, (p) => p.km), 0), porPlaca.length + " caminhões rastreados"),
      kpi("Horas em movimento", num(soma(porPlaca, (p) => p.mov), 1), "motor ligado e andando"),
      kpi("Horas com motor ligado parado", num(soma(porPlaca, (p) => p.lig), 1), "diesel gasto sem andar"),
      kpi("Minutos acima do limite", num(soma(porPlaca, (p) => p.acima), 0), "acima de " + LIMITE_VEL + " km/h, o máximo do CTB para caminhão"),
      kpi("Pontos para conferir", String(A.length), A.filter((a) => a.severidade === "alta").length + " de prioridade alta"));

    const semana = tabela(
      [{ t: "Caminhão" }, { t: "Km", n: 1 }, { t: "Vel. máx. (km/h)", n: 1 }, { t: "Min. acima do limite", n: 1 }, { t: "Em movimento (h)", n: 1 }, { t: "Ligado parado (h)", n: 1 }, { t: "% ligado parado", n: 1 }, { t: "Dias que terminam fora do pátio", n: 1 }],
      porPlaca.map((p) => [placa(p.placa), num(p.km, 0), { v: num(p.vel, 0), class: p.vel >= 100 ? "ruim" : "" }, { v: num(p.acima, 0), class: p.acima >= 30 ? "ruim" : "" }, num(p.mov, 1), num(p.lig, 1), { v: num(p.pct, 0), class: p.pct >= 50 ? "ruim" : "" }, num(p.fora, 0)]),
      "Sem dados nesta semana.");

    // km por dia (mapa de calor)
    const datas = Array.from({ length: 7 }, (_, i) => maisDias(s, i));
    const km = new Map(D.map((r) => [r.placa + "|" + r.dia, +r.km]));
    const max = Math.max(1, ...D.map((r) => +r.km || 0));
    const calor = tabela(
      [{ t: "Caminhão" }, ...datas.map((x) => ({ t: nomeDia(x), n: 1 }))],
      porPlaca.map((p) => [placa(p.placa), ...datas.map((x) => {
        const v = km.get(p.placa + "|" + x);
        if (v == null || v < 1) return { v: "·", class: "c zero" };
        const t = Math.min(1, v / max);
        return { v: num(v, 0), class: "c", style: "background: color-mix(in srgb, var(--accent) " + Math.round(8 + t * 62) + "%, transparent);" + (t > 0.55 ? "color: var(--bg);" : "") };
      })]),
      "", "calor");

    const PRIO = { alta: ["Alta", "crit"], media: ["Média", "warn"], baixa: ["Baixa", "neutro"] };
    const ordem = { alta: 0, media: 1, baixa: 2 };
    const lista = [...A].sort((x, y) => (ordem[x.severidade] - ordem[y.severidade]) || String(x.quando).localeCompare(String(y.quando)));
    const tabAlertas = tabela(
      [{ t: "Quando" }, { t: "Caminhão" }, { t: "Prioridade" }, { t: "Tipo" }, { t: "O que os dados mostram", texto: 1 }, { t: "Onde" }],
      lista.map((a) => {
        const det = a.detalhe || {};
        const lat = +det.latitude, lon = +det.longitude;
        const [nome, cls] = PRIO[a.severidade] || [a.severidade, "neutro"];
        return [
          dataHora(a.quando), placa(a.placa), tag(nome, cls), det.tipo || a.regra.replace(/_/g, " "), det.texto || "—",
          Number.isFinite(lat) && Number.isFinite(lon) && (lat || lon) ? el("a", { href: "https://www.google.com/maps?q=" + lat + "," + lon, target: "_blank", rel: "noopener", text: "Ver no mapa" }) : "—",
        ];
      }),
      "Nenhum alerta nesta semana.");

    const notas = el("details", { class: "notas" },
      el("summary", { text: "Como os números e os alertas são calculados" }),
      el("ul", {},
        el("li", { text: "Fonte: Histórico de posições do Fulltrack, exportado do painel da revenda e resumido por analise/resumo_frota.py. Só aparecem as semanas já carregadas no banco." }),
        el("li", { text: "Tempo de cada estado é o intervalo até a posição seguinte, limitado a 10 min, para um buraco de comunicação não virar hora de motor ligado." }),
        el("li", { text: "Pátio: raio de 300 m do ponto EMPRESA (BASE) cadastrado no Fulltrack (Vila Velha)." }),
        el("li", { text: "Velocidade: limite de " + LIMITE_VEL + " km/h para caminhão (CTB, art. 61). Alerta com 30 min ou mais na semana acima dele, ou pico de 100 km/h." }),
        el("li", { text: "Motor ligado parado: 15 min ou mais numa parada fora do pátio, exceto em oficina cadastrada." }),
        el("li", { text: "Rastreador: eventos como Cabo da Bateria Violado. No pátio, sábado de manhã, pode ser a chave geral desligada." }),
        el("li", { text: "Alertas por placa, sem nome de motorista." })));

    raiz.replaceChildren(
      cabecalho("Rotas (GPS)", "Resumo semanal do Histórico de posições do Fulltrack, por caminhão rastreado. Alertas por placa, sem nome de motorista.", filtro), kpis,
      secao("Por caminhão", null, semana),
      secao("Km por dia", "Quanto mais forte a cor, mais o caminhão rodou no dia. Um ponto (·) é dia sem quilômetro rodado.", calor),
      secao("Para conferir", "Um alerta é uma pergunta para quem gere a frota, não uma acusação.", tabAlertas),
      notas,
    );
  }

  // ---------- início ----------
  const salvo = guardar.ler();
  if (salvo) { est.codigo = salvo; carregar(); }
})();
</script>
</body>
</html>
